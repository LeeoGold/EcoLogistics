name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-gate:
    name: Validate E2E before deployment
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          CI: true
          E2E_USE_API_MOCKS: 'true'

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-gate-e2e-${{ github.run_number }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Trigger and verify production deployment
    needs: e2e-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required deployment secrets
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
          BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          FRONTEND_HEALTHCHECK_URL: ${{ secrets.FRONTEND_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          for name in BACKEND_DEPLOY_HOOK_URL FRONTEND_DEPLOY_HOOK_URL BACKEND_HEALTHCHECK_URL FRONTEND_HEALTHCHECK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secreto $name en GitHub Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Trigger backend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --request POST "$DEPLOY_HOOK_URL"

      - name: Trigger frontend deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --request POST "$DEPLOY_HOOK_URL"

      - name: Wait for backend health check
        env:
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" >/dev/null; then
              echo "Backend health check passed."
              exit 0
            fi
            echo "Backend todavía no está disponible (intento $attempt/30)."
            sleep 10
          done
          echo "::error::Backend health check did not pass within 5 minutes."
          exit 1

      - name: Wait for frontend health check
        env:
          HEALTHCHECK_URL: ${{ secrets.FRONTEND_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTHCHECK_URL" >/dev/null; then
              echo "Frontend health check passed."
              exit 0
            fi
            echo "Frontend todavía no está disponible (intento $attempt/30)."
            sleep 10
          done
          echo "::error::Frontend health check did not pass within 5 minutes."
          exit 1
