name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/sprint-3-quality-evaluation
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (SQLite aislada)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-tests.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-tests.txt

      - name: Run tests and generate coverage report
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Configure Node.js for frontend coverage
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for coverage
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests and generate LCOV
        run: npm run test:coverage
        working-directory: frontend

      - name: Verify frontend LCOV report
        run: test -s coverage/lcov.info
        working-directory: frontend

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
