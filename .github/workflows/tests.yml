name: Tests and E2E

on:
  push:
    branches:
      - main
      - develop
      - fix/sprint4-complete-test-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-tests.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-tests.txt

      - name: Validate backend dependencies
        run: python -m pip check

      - name: Run backend unit and integration tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=pytest-report.xml

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_number }}
          path: |
            backend/coverage.xml
            backend/pytest-report.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: Frontend unit and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend unit and integration tests
        run: npm run test:coverage

      - name: Upload frontend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports-${{ github.run_number }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  playwright-e2e:
    name: Playwright E2E (Chromium, Firefox and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run End-to-End suite
        run: npm run test:e2e
        env:
          CI: true
          E2E_USE_API_MOCKS: 'true'

      - name: Upload Playwright HTML report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ github.run_number }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
